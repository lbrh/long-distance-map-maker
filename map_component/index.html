<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: #fff; color: #212529; }
    #map { height: 560px; }
    #panel { padding: 10px 14px; background: #fff; }
    .status { padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-size: 14px; line-height: 1.4; }
    .info    { background: #ebf5fb; color: #1a5276; border-left: 3px solid #2980b9; }
    .success { background: #eafaf1; color: #1e8449; border-left: 3px solid #27ae60; }
    table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; background: #fff; }
    th { background: #f0f2f4; padding: 6px 10px; text-align: left; border-bottom: 2px solid #dee2e6; font-weight: 600; color: #333; }
    td { padding: 5px 10px; border-bottom: 1px solid #e9ecef; color: #212529; background: #fff; }
    tr:hover td { background: #f8f9fa; }
    .del-btn { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 16px; padding: 0 4px; line-height: 1; }
    .del-btn:hover { color: #c0392b; }
    .leg-cell { white-space: nowrap; }
    .leg-from, .leg-to { font-weight: 500; color: #212529; }
    .leg-arrow { color: #e74c3c; margin: 0 6px; font-weight: bold; }
    .nm-cell { color: #555; white-space: nowrap; }
    .actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    .actions input { flex: 1; padding: 6px 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; background: #fff; color: #212529; }
    .btn-save  { padding: 6px 16px; background: #2980b9; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-save:hover  { background: #1f6fa8; }
    .btn-clear { padding: 6px 12px; background: #fff; color: #6c757d; border: 1px solid #ced4da; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-clear:hover { background: #f0f2f4; }
    .btn-gpx  { padding: 6px 12px; background: #fff; color: #27ae60; border: 1px solid #27ae60; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-gpx:hover  { background: #eafaf1; }

    /* Saved maps panel */
    .saved-section { margin-top: 10px; border-top: 1px solid #e9ecef; padding-top: 8px; }
    .saved-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .saved-title { font-size: 13px; font-weight: 600; color: #333; }
    .saved-toggle { background: none; border: none; cursor: pointer; font-size: 12px; color: #2980b9; padding: 0; }
    .saved-toggle:hover { text-decoration: underline; }
    .saved-list { display: flex; flex-direction: column; gap: 4px; }
    .saved-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid #e9ecef; border-radius: 5px; background: #fafbfc; }
    .saved-item:hover { background: #f0f4f8; }
    .saved-item-name { flex: 1; font-size: 13px; font-weight: 500; color: #212529; }
    .saved-item-meta { font-size: 11px; color: #888; white-space: nowrap; }
    .btn-load { padding: 3px 10px; background: #2980b9; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-load:hover { background: #1f6fa8; }
    .btn-del-saved { background: none; border: none; color: #ccc; cursor: pointer; font-size: 14px; padding: 0 2px; }
    .btn-del-saved:hover { color: #e74c3c; }
    .saved-empty { font-size: 12px; color: #aaa; font-style: italic; padding: 4px 0; }

    /* Movable marks */
    .movable-section { margin: 6px 0 2px; padding: 8px 0 4px; border-top: 1px solid #e9ecef; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .movable-label { font-size: 13px; font-weight: 600; color: #7d5a00; white-space: nowrap; }
    .btn-place { padding: 4px 11px; background: #f39c12; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-place:hover { background: #d68910; }
    .btn-place.active { background: #d35400; animation: pulse 1s infinite; }
    .btn-clear-movable { padding: 4px 10px; background: #fff; color: #999; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-clear-movable:hover { background: #fef9e7; color: #d68910; border-color: #f39c12; }
    .movable-badges { display: flex; flex-wrap: wrap; gap: 4px; }
    .movable-badge { display: inline-flex; align-items: center; gap: 3px; background: #fef9e7; border: 1px solid #f39c12; border-radius: 12px; padding: 2px 7px 2px 8px; font-size: 12px; color: #7d5a00; font-weight: 600; }
    .movable-badge .mbdel { background: none; border: none; color: #d68910; cursor: pointer; font-size: 12px; padding: 0; line-height: 1; }
    .movable-badge .mbdel:hover { color: #c0392b; }
    .place-banner { font-size: 12px; color: #d35400; font-style: italic; padding: 3px 0; width: 100%; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.7; } }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <div id="status" class="status info">Click a mark to start your course.</div>

    <!-- Movable marks toolbar -->
    <div class="movable-section" id="movable-section">
      <span class="movable-label">⬤ Laid Marks</span>
      <button class="btn-place" id="btn-place" onclick="togglePlaceMode()">+ Add</button>
      <button class="btn-clear-movable" onclick="clearMovable()" title="Remove all laid marks">Clear all</button>
      <div class="movable-badges" id="movable-badges"></div>
      <div class="place-banner" id="place-banner" style="display:none">Click anywhere on the map to place a laid mark.</div>
    </div>

    <div id="legs-container"></div>
    <div id="actions" class="actions" style="display:none">
      <button class="btn-clear" onclick="clearRoute()">🧹 Clear</button>
      <input type="text" id="route-name" value="Race 1" placeholder="Route name"/>
      <button class="btn-save" onclick="saveRoute()">💾 Save Route</button>
      <button class="btn-gpx" onclick="exportGPX()">📤 Export GPX</button>
    </div>

    <div class="saved-section">
      <div class="saved-header">
        <span class="saved-title">Saved Maps</span>
        <button class="saved-toggle" onclick="toggleSavedPanel()" id="saved-toggle-btn">▲ hide</button>
      </div>
      <div id="saved-panel">
        <div class="saved-list" id="saved-list"></div>
      </div>
    </div>
  </div>

  <script>
    // ── Streamlit wire protocol ──────────────────────────────────────────────
    function toStreamlit(value) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setComponentValue", value, dataType: "json" },
        "*"
      );
    }
    function setHeight() {
      requestAnimationFrame(() => {
        window.parent.postMessage(
          { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: document.body.scrollHeight + 16 },
          "*"
        );
      });
    }
    window.parent.postMessage(
      { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 },
      "*"
    );

    // ── Persistent state ────────────────────────────────────────────────────
    const LS_ROUTE    = "pp_race_route";
    const LS_CENTER   = "pp_map_center";
    const LS_ZOOM     = "pp_map_zoom";
    const LS_MOVABLE  = "pp_movable_marks";
    const LS_SAVED    = "pp_saved_maps";

    let route         = JSON.parse(localStorage.getItem(LS_ROUTE)   || "[]");
    let allMarks      = [];          // fixed marks from CSV
    let markerLayers  = {};          // fixed mark layers
    let routeLine     = null;

    // Movable / laid marks
    let movableMarks  = JSON.parse(localStorage.getItem(LS_MOVABLE) || "[]");
    let movableLayers = {};
    let movableCounter = 1;
    let placeMode     = false;

    if (movableMarks.length > 0) {
      movableCounter = Math.max(...movableMarks.map(m => parseInt(m.name.replace(/\D/g,"")) || 0)) + 1;
    }

    // ── Haversine ────────────────────────────────────────────────────────────
    function haversineNm(lat1, lon1, lat2, lon2) {
      const R = 6371, r = Math.PI / 180;
      const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
      const a = Math.sin(dLat/2)**2 +
                Math.cos(lat1*r) * Math.cos(lat2*r) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)) / 1.852;
    }

    // ── Map setup ────────────────────────────────────────────────────────────
    const savedCenter = JSON.parse(localStorage.getItem(LS_CENTER) || "null");
    const savedZoom   = JSON.parse(localStorage.getItem(LS_ZOOM)   || "11");

    const map = L.map("map", { preferCanvas: false })
                 .setView(savedCenter || [-37.95, 144.92], savedZoom || 11);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      { attribution: "© OpenStreetMap" }).addTo(map);
    L.tileLayer("https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png",
      { attribution: "© OpenSeaMap", opacity: 0.8 }).addTo(map);

    map.on("moveend zoomend", () => {
      const c = map.getCenter();
      localStorage.setItem(LS_CENTER, JSON.stringify([c.lat, c.lng]));
      localStorage.setItem(LS_ZOOM,   JSON.stringify(map.getZoom()));
    });

    // Place mode: click map to drop a movable mark
    map.on("click", function(e) {
      if (!placeMode) return;
      createMovableMarker("M" + movableCounter++, e.latlng.lat, e.latlng.lng);
      saveMovable();
      placeMode = false;
      map.getContainer().style.cursor = "";
      document.getElementById("btn-place").classList.remove("active");
      document.getElementById("place-banner").style.display = "none";
      renderMovableBadges();
      render();
    });

    // ── Fixed mark style ─────────────────────────────────────────────────────
    const styleFor = sel => ({
      radius: sel ? 9 : 7,
      color: sel ? "#e74c3c" : "#2980b9",
      fillColor: sel ? "#e74c3c" : "#2980b9",
      fillOpacity: sel ? 1.0 : 0.8,
      weight: 2
    });

    // ── Movable mark icon (orange, draggable L.marker) ────────────────────────
    function movableIcon(selected) {
      const bg     = selected ? "#d35400" : "#f39c12";
      const border = selected ? "#c0392b" : "#d68910";
      const size   = selected ? 18 : 14;
      const half   = size / 2;
      return L.divIcon({
        className: "",
        html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};border:2px solid ${border};opacity:0.95;box-shadow:0 1px 4px rgba(0,0,0,0.35);"></div>`,
        iconSize:   [size, size],
        iconAnchor: [half, half],
        tooltipAnchor: [half, -half]
      });
    }

    function createMovableMarker(name, lat, lng) {
      // Don't recreate if already exists
      if (movableLayers[name]) return;

      // Ensure the data record exists
      if (!movableMarks.find(m => m.name === name)) {
        movableMarks.push({ name, lat, lng });
      }

      const sel = route.includes(name);
      const marker = L.marker([lat, lng], {
        icon: movableIcon(sel),
        draggable: true,
        zIndexOffset: 500
      }).addTo(map);

      marker.bindTooltip(name, { direction: "top", offset: [0, -8], permanent: false });

      marker.on("click", () => addMark(name));
      marker.on("dragend", function() {
        const pos = marker.getLatLng();
        const rec = movableMarks.find(m => m.name === name);
        if (rec) { rec.lat = pos.lat; rec.lng = pos.lng; }
        saveMovable();
        render();
      });

      movableLayers[name] = marker;
    }

    function saveMovable() {
      localStorage.setItem(LS_MOVABLE, JSON.stringify(
        movableMarks.map(({ name, lat, lng }) => ({ name, lat, lng }))
      ));
    }

    function removeMovableMark(name) {
      const layer = movableLayers[name];
      if (layer) { map.removeLayer(layer); delete movableLayers[name]; }
      movableMarks = movableMarks.filter(m => m.name !== name);
      route = route.filter(r => r !== name);
      saveMovable();
      renderMovableBadges();
      render();
    }

    function clearMovable() {
      Object.values(movableLayers).forEach(l => map.removeLayer(l));
      movableLayers = {};
      movableMarks = [];
      route = route.filter(r => !r.startsWith("M") || allMarks.find(m => m.name === r));
      movableCounter = 1;
      saveMovable();
      renderMovableBadges();
      render();
    }

    function togglePlaceMode() {
      placeMode = !placeMode;
      const btn = document.getElementById("btn-place");
      const banner = document.getElementById("place-banner");
      if (placeMode) {
        btn.classList.add("active");
        btn.textContent = "✕ Cancel";
        banner.style.display = "block";
        map.getContainer().style.cursor = "crosshair";
      } else {
        btn.classList.remove("active");
        btn.textContent = "+ Add";
        banner.style.display = "none";
        map.getContainer().style.cursor = "";
      }
      setHeight();
    }

    function renderMovableBadges() {
      const container = document.getElementById("movable-badges");
      container.innerHTML = movableMarks.map(m =>
        `<span class="movable-badge">${m.name}<button class="mbdel" onclick="removeMovableMark('${m.name}')" title="Remove ${m.name}">✕</button></span>`
      ).join("");
      setHeight();
    }

    // ── Combine fixed + movable for routing ───────────────────────────────────
    function getAllMarks() {
      return [...allMarks, ...movableMarks.map(({ name, lat, lng }) => ({ name, lat, lng }))];
    }

    // ── Full render ───────────────────────────────────────────────────────────
    function render() {
      const sel = new Set(route);

      // Fixed mark colours
      allMarks.forEach(m => {
        const layer = markerLayers[m.name];
        if (layer) layer.setStyle(styleFor(sel.has(m.name)));
      });

      // Movable mark icons
      movableMarks.forEach(m => {
        const layer = movableLayers[m.name];
        if (layer) layer.setIcon(movableIcon(sel.has(m.name)));
      });

      // Route polyline
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      if (route.length >= 2) {
        const marks = getAllMarks();
        const coords = route
          .map(n => marks.find(m => m.name === n))
          .filter(Boolean)
          .map(m => [m.lat, m.lng]);
        if (coords.length >= 2)
          routeLine = L.polyline(coords, { color: "#e74c3c", weight: 3, opacity: 0.9 }).addTo(map);
      }

      // Status banner + legs table
      const statusEl  = document.getElementById("status");
      const container = document.getElementById("legs-container");
      const actionsEl = document.getElementById("actions");

      if (route.length === 0) {
        statusEl.className = "status info";
        statusEl.textContent = "Click a mark to start your course.";
        container.innerHTML = "";
        actionsEl.style.display = "none";
        localStorage.removeItem(LS_ROUTE);
        setHeight();
        return;
      }
      if (route.length === 1) {
        statusEl.className = "status info";
        statusEl.textContent = `${route[0]} selected — click the next mark to create a leg.`;
        container.innerHTML = "";
        actionsEl.style.display = "none";
        localStorage.setItem(LS_ROUTE, JSON.stringify(route));
        setHeight();
        return;
      }

      const marks = getAllMarks();
      let total = 0, rows = "";
      for (let i = 0; i < route.length - 1; i++) {
        const a = marks.find(m => m.name === route[i]);
        const b = marks.find(m => m.name === route[i + 1]);
        if (!a || !b) continue;
        const nm = haversineNm(a.lat, a.lng, b.lat, b.lng);
        total += nm;
        const aLabel = movableMarks.find(m => m.name === a.name)
          ? `<span style="color:#d68910;font-weight:600">${a.name}</span>`
          : `<span class="leg-from">${a.name}</span>`;
        const bLabel = movableMarks.find(m => m.name === b.name)
          ? `<span style="color:#d68910;font-weight:600">${b.name}</span>`
          : `<span class="leg-to">${b.name}</span>`;
        rows += `<tr>
          <td class="leg-cell">${aLabel}<span class="leg-arrow">→</span>${bLabel}</td>
          <td class="nm-cell">${nm.toFixed(2)} NM</td>
          <td><button class="del-btn" onclick="deleteLeg(${i})">✕</button></td>
        </tr>`;
      }

      const legCount = route.length - 1;
      statusEl.className = "status success";
      statusEl.textContent = `${legCount} leg${legCount !== 1 ? "s" : ""} | Total: ${total.toFixed(2)} NM`;

      container.innerHTML = `
        <table>
          <thead><tr><th>Leg</th><th>Distance</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;

      actionsEl.style.display = "flex";
      localStorage.setItem(LS_ROUTE, JSON.stringify(route));
      setHeight();
    }

    // ── User actions ─────────────────────────────────────────────────────────
    function addMark(name) {
      route.push(name);
      render();
    }

    function deleteLeg(i) {
      route.splice(i + 1, 1);
      render();
    }

    function clearRoute() {
      route = [];
      render();
    }

    // ── Saved maps ───────────────────────────────────────────────────────────
    let savedPanelOpen = true;

    function toggleSavedPanel() {
      savedPanelOpen = !savedPanelOpen;
      document.getElementById("saved-panel").style.display = savedPanelOpen ? "block" : "none";
      document.getElementById("saved-toggle-btn").textContent = savedPanelOpen ? "▲ hide" : "▼ show";
      if (savedPanelOpen) renderSavedMaps();
      setHeight();
    }

    function getSavedMaps() {
      return JSON.parse(localStorage.getItem(LS_SAVED) || "[]");
    }

    function renderSavedMaps() {
      const maps = getSavedMaps();
      const list = document.getElementById("saved-list");
      if (maps.length === 0) {
        list.innerHTML = '<div class="saved-empty">No saved maps yet.</div>';
        setHeight();
        return;
      }
      list.innerHTML = maps.map((m, i) => {
        const date = new Date(m.ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
        const legCount = Math.max(0, m.route.length - 1);
        return `<div class="saved-item">
          <span class="saved-item-name">${escXml(m.name)}</span>
          <span class="saved-item-meta">${legCount} leg${legCount !== 1 ? "s" : ""} &middot; ${date}</span>
          <button class="btn-load" onclick="loadMap(${i})">Load</button>
          <button class="btn-del-saved" onclick="deleteSavedMap(${i})" title="Delete">✕</button>
        </div>`;
      }).join("");
      setHeight();
    }

    function saveRoute() {
      const name = document.getElementById("route-name").value.trim() || "Race 1";
      const maps = getSavedMaps();
      maps.unshift({ name, ts: Date.now(), route: [...route], movableMarks: movableMarks.map(m => ({...m})) });
      localStorage.setItem(LS_SAVED, JSON.stringify(maps));
      toStreamlit({ action: "save", route, name, ts: Date.now() });
      if (savedPanelOpen) renderSavedMaps();
      // Flash the saved section open if it was closed
      if (!savedPanelOpen) {
        savedPanelOpen = true;
        document.getElementById("saved-panel").style.display = "block";
        document.getElementById("saved-toggle-btn").textContent = "▲ hide";
        renderSavedMaps();
      }
    }

    function loadMap(index) {
      const maps = getSavedMaps();
      const saved = maps[index];
      if (!saved) return;

      // Restore movable marks: add any that don't exist yet
      saved.movableMarks.forEach(m => {
        if (!movableMarks.find(x => x.name === m.name)) {
          movableMarks.push({ name: m.name, lat: m.lat, lng: m.lng });
        } else {
          const rec = movableMarks.find(x => x.name === m.name);
          rec.lat = m.lat; rec.lng = m.lng;
        }
        if (movableLayers[m.name]) {
          movableLayers[m.name].setLatLng([m.lat, m.lng]);
        } else {
          createMovableMarker(m.name, m.lat, m.lng);
        }
      });
      // Update counter so new marks don't collide
      if (movableMarks.length > 0) {
        movableCounter = Math.max(...movableMarks.map(m => parseInt(m.name.replace(/\D/g,"")) || 0)) + 1;
      }
      saveMovable();
      renderMovableBadges();

      route = [...saved.route];
      document.getElementById("route-name").value = saved.name;
      render();
    }

    function deleteSavedMap(index) {
      const maps = getSavedMaps();
      maps.splice(index, 1);
      localStorage.setItem(LS_SAVED, JSON.stringify(maps));
      renderSavedMaps();
    }

    function exportGPX() {
      if (route.length < 2) return;
      const name  = document.getElementById("route-name").value.trim() || "Race 1";
      const now   = new Date().toISOString();
      const marks = getAllMarks();

      const wpts = route.map(n => {
        const m = marks.find(m => m.name === n);
        if (!m) return "";
        return `  <wpt lat="${m.lat}" lon="${m.lng}"><name>${escXml(m.name)}</name></wpt>`;
      }).filter(Boolean).join("\n");

      const rtepts = route.map(n => {
        const m = marks.find(m => m.name === n);
        if (!m) return "";
        return `    <rtept lat="${m.lat}" lon="${m.lng}"><name>${escXml(m.name)}</name></rtept>`;
      }).filter(Boolean).join("\n");

      const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Port Phillip Race Mapper"
     xmlns="http://www.topografix.com/GPX/1/1"
     xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
     xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <metadata><name>${escXml(name)}</name><time>${now}</time></metadata>
${wpts}
  <rte>
    <name>${escXml(name)}</name>
${rtepts}
  </rte>
</gpx>`;

      const blob = new Blob([gpx], { type: "application/gpx+xml" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href     = url;
      a.download = name.replace(/[^a-z0-9_-]/gi, "_") + ".gpx";
      a.click();
      URL.revokeObjectURL(url);
    }

    function escXml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // ── Bootstrap from Streamlit render event ────────────────────────────────
    window.addEventListener("message", function(evt) {
      if (!evt.data || evt.data.type !== "streamlit:render") return;
      allMarks = (evt.data.args || {}).marks || [];

      // Rebuild fixed markers
      Object.values(markerLayers).forEach(l => map.removeLayer(l));
      markerLayers = {};

      const sel = new Set(route);
      allMarks.forEach(mark => {
        const circle = L.circleMarker([mark.lat, mark.lng], styleFor(sel.has(mark.name))).addTo(map);
        circle.bindTooltip(mark.name, { direction: "top", offset: [0, -6] });
        circle.on("click", () => addMark(mark.name));
        markerLayers[mark.name] = circle;
      });

      // Restore movable markers from localStorage
      movableMarks.forEach(m => createMovableMarker(m.name, m.lat, m.lng));

      if (!savedCenter && allMarks.length > 0) {
        const avgLat = allMarks.reduce((s, m) => s + m.lat, 0) / allMarks.length;
        const avgLng = allMarks.reduce((s, m) => s + m.lng, 0) / allMarks.length;
        map.setView([avgLat, avgLng], 11);
      }

      renderMovableBadges();
      renderSavedMaps();
      render();
    });
  </script>
</body>
</html>
